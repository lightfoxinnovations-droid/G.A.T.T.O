name: gatto_app
description: App G.A.T.T.O. per configurare e controllare il robot.
publish_to: "none"
version: 1.1.8+14

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  app_settings: ^6.1.1
  http: ^1.2.2
  network_info_plus: ^6.1.3
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.3
  wifi_iot: ^0.3.19
  flutter_local_notifications: ^18.0.1
  workmanager: ^0.10.10

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
