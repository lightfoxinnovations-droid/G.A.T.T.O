interface=ap0
bind-dynamic
except-interface=lo
dhcp-range=192.168.4.10,192.168.4.50,255.255.255.0,12h
dhcp-option=3,192.168.4.1
dhcp-option=6,192.168.4.1
dhcp-authoritative
dhcp-rapid-commit
dhcp-lease-max=32
# Senza inoltro: una query DNS non resta appesa se il Pi non ha internet.
no-resolv
no-hosts
cache-size=200
neg-ttl=5
log-async=25
log-facility=/home/gatito/gatto-hotspot/dnsmasq.log
