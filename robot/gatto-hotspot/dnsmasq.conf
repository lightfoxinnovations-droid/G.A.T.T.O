interface=ap0
bind-dynamic
except-interface=lo
dhcp-range=192.168.4.10,192.168.4.50,255.255.255.0,12h
# Niente gateway: Android non apre il captive portal e non dirotta 192.168.4.1 sui dati mobili.
dhcp-option=6,192.168.4.1
dhcp-authoritative
dhcp-rapid-commit
user=root
dhcp-leasefile=/home/gatito/gatto-hotspot/dnsmasq.leases
dhcp-lease-max=32
# Senza inoltro: una query DNS non resta appesa se il Pi non ha internet.
no-resolv
no-hosts
cache-size=200
neg-ttl=5
log-async=25
log-facility=/home/gatito/gatto-hotspot/dnsmasq.log
